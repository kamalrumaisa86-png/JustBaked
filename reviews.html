
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustBaked | Reviews</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="reviews.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Just<span>Baked</span><span class="brand-dot">.</span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#nav"
                    aria-controls="nav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="reviews.html"
                           aria-current="page">Reviews</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Menu</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a class="btn nav-order-btn"
                           href="https://www.instagram.com/justbaked.bd/"
                           target="_blank"
                           rel="noopener noreferrer">
                            Order Now
                            <i class="bi bi-arrow-up-right"></i>
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <main>

        <!-- REVIEWS HERO -->
        <section class="hero">
            <div class="container">
                <div class="row align-items-center g-5">
                    <div class="col-12 hero-content">

                        <div class="eyebrow">
                            <span class="eyebrow-line"></span>
                            JUSTBAKED • CUSTOMER LOVE
                        </div>

                        <h1>Love From Our Customers ♡</h1>

                        <p>
                            Sweet words, beautiful memories, and
                            <em>a little bit of cake.</em>
                        </p>

                    </div>
                </div>
            </div>
        </section>

        <!-- CUSTOMER REVIEWS GALLERY -->
        <section class="reviews-gallery"
                 aria-label="Customer reviews and cake photographs">

            <div class="container">
                <div class="reviews-grid">

                    <!-- REVIEW PAIR 01 -->

                    <div class="reviews-card">
                        <img src="images/The_cake1.jpeg"
                             alt="The first cake"
                             loading="lazy">
                    </div>

                    <div class="reviews-card">
                        <img src="images/The_review1.jpeg"
                             alt="The first review"
                             loading="lazy">
                    </div>

                    <!-- REVIEW PAIR 02 -->

                    <div class="reviews-card">
                        <img src="images/The_cake2.jpeg"
                             alt="The second cake"
                             loading="lazy">
                    </div>

                    <div class="reviews-card">
                        <img src="images/The_review2.jpeg"
                             alt="The second review"
                             loading="lazy">
                    </div>

                </div>
            </div>
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
